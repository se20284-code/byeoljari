<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 별자리 운세</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --card-bg:rgba(255,255,255,.07);
    --card-br:rgba(255,255,255,.18);
    --txt:#eef1ff;
    --sub:#a9b2d6;
    --accent:#b9a6ff;
  }
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--txt);
    background:linear-gradient(180deg,#05060f 0%,#0b1030 35%,#1a1446 65%,#2a1b52 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 16px 40px;
    overflow-x:hidden;
    position:relative;
  }
  /* 별 배경 */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
  .shooting{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
    box-shadow:0 0 6px 2px rgba(255,255,255,.8);animation:shoot 6s linear infinite}
  @keyframes shoot{
    0%{transform:translate(0,0);opacity:0}
    5%{opacity:1}
    25%{transform:translate(-260px,160px);opacity:0}
    100%{transform:translate(-260px,160px);opacity:0}
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:520px}
  header{text-align:center;margin-bottom:22px}
  header h1{font-size:1.55rem;letter-spacing:-.02em;font-weight:700;
    background:linear-gradient(90deg,#fff,#c9b8ff,#8fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin-top:8px;font-size:.85rem;color:var(--sub)}
  .card{
    background:var(--card-bg);
    border:1px solid var(--card-br);
    border-radius:20px;
    padding:22px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    margin-bottom:16px;
  }
  label{display:block;font-size:.85rem;color:var(--sub);margin-bottom:10px}
  .row{display:flex;gap:10px}
  input[type=date]{
    flex:1;min-width:0;
    padding:13px 14px;border-radius:12px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.28);
    color:var(--txt);font-size:1rem;font-family:inherit;
    outline:none;transition:.2s;
    color-scheme:dark;
  }
  input[type=date]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(185,166,255,.2)}
  button{
    padding:13px 20px;border:none;border-radius:12px;cursor:pointer;
    font-family:inherit;font-size:.95rem;font-weight:700;color:#1a1030;
    background:linear-gradient(135deg,#d6c8ff,#9fd8ff);
    transition:transform .15s, box-shadow .2s;
    white-space:nowrap;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(180,160,255,.35)}
  button:active{transform:translateY(0)}
  .msg{margin-top:12px;font-size:.85rem;min-height:1.2em;color:#ffb4b4}
  .msg.ok{color:#9fe8c0}
  /* 결과 */
  #result{display:none}
  #result.show{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sign-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .sign-icon{font-size:2.4rem;line-height:1;filter:drop-shadow(0 0 12px rgba(200,180,255,.7))}
  .sign-name{font-size:1.35rem;font-weight:700}
  .sign-meta{font-size:.78rem;color:var(--sub);margin-top:3px}
  .date-line{font-size:.78rem;color:var(--sub);margin-bottom:16px}
  .trait{font-size:.9rem;line-height:1.65;color:#dfe4ff;margin-bottom:18px}
  .bar-item{margin-bottom:14px}
  .bar-top{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
  .bar-top b{font-weight:600;color:#e7ebff}
  .bar-top span{color:var(--accent);font-variant-numeric:tabular-nums}
  .bar-bg{height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;width:0;
    background:linear-gradient(90deg,#8f7bff,#b9a6ff,#8fd8ff);
    box-shadow:0 0 12px rgba(160,140,255,.6);
    transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .fortune-text{font-size:.9rem;line-height:1.7;color:#e3e7ff;margin-top:18px;
    padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);
    border-left:3px solid var(--accent)}
  .lucky{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .lucky-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:14px;text-align:center}
  .lucky-box .t{font-size:.75rem;color:var(--sub);margin-bottom:8px}
  .nums{display:flex;gap:8px;justify-content:center}
  .num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.95rem;background:linear-gradient(135deg,rgba(185,166,255,.35),rgba(143,216,255,.25));
    border:1px solid rgba(255,255,255,.25)}
  .color-chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5);box-shadow:0 0 12px currentColor}
  footer{position:relative;z-index:1;margin-top:8px;text-align:center;font-size:.72rem;color:#7f88ad;line-height:1.7;max-width:520px}
  @media (max-width:420px){
    body{padding:22px 12px 32px}
    header h1{font-size:1.3rem}
    .card{padding:18px;border-radius:16px}
    .row{flex-direction:column}
    button{width:100%}
    .lucky{grid-template-columns:1fr}
  }
</style>

    {name:"스카이 블루", hex:"#38BDF8"},
    {name:"버건디", hex:"#9F1239"},
    {name:"아이보리", hex:"#F5F0E1"},
    {name:"딥 틸", hex:"#0D9488"},
    {name:"오렌지", hex:"#FB923C"},
    {name:"실버", hex:"#C0C8D8"},
    {name:"네이비", hex:"#1E3A8A"}
  ];

  var FORTUNE_LINES = {
    "총운":[
      "오늘은 흐름이 부드러운 하루예요. 미뤄둔 일을 하나 정리하면 마음이 한결 가벼워질 거예요.",
      "작은 선택 하나가 좋은 방향으로 이어지는 날이에요. 직감을 믿어보세요.",
      "평소보다 에너지가 잘 돌아요. 중요한 일은 오전에 시작하면 좋아요.",
      "잠시 쉬어가는 것도 전진이에요. 무리하지 않으면 좋은 결과가 따라와요.",
      "예상치 못한 반가운 소식이 들릴 수 있어요. 주변 사람의 말에 귀 기울여 보세요."
    ],
    "애정운":[
      "솔직한 표현이 관계를 한 뼘 더 가깝게 만들어요. 짧은 안부 한마디가 큰 힘이 돼요.",
      "상대의 이야기를 끝까지 들어주면 신뢰가 쌓이는 날이에요.",
      "설렘의 기운이 감도는 하루예요. 가벼운 약속이 좋은 인연으로 이어질 수 있어요.",
      "오해가 있다면 먼저 다가가 보세요. 생각보다 쉽게 풀릴 거예요.",
      "혼자만의 시간도 소중해요. 나를 아끼는 마음이 관계에도 좋은 영향을 줘요."
    ],
    "금전운":[
      "충동구매만 피하면 지갑이 든든한 하루예요. 필요한 것과 갖고 싶은 것을 구분해 보세요.",
      "작은 절약이 쌓여 기분 좋은 결과로 돌아와요. 고정 지출을 한 번 점검해 보세요.",
      "예상하지 못한 지출이 생길 수 있어요. 여유 자금을 조금 남겨두면 안심이 돼요.",
      "정보를 꼼꼼히 비교하면 좋은 선택을 할 수 있어요. 서두르지 마세요.",
      "주변의 조언이 도움이 되는 날이에요. 큰 결정은 하루 더 생각해 보세요."
    ],
    "일/학업운":[
      "집중력이 좋은 날이에요. 가장 어려운 과제를 먼저 꺼내 보세요.",
      "협업에서 좋은 아이디어가 나와요. 내 생각을 편하게 꺼내 보세요.",
      "작은 실수가 있을 수 있지만 금방 만회할 수 있어요. 확인 한 번만 더!",
      "꾸준함이 빛을 발하는 하루예요. 오늘의 한 걸음이 결과를 바꿔요.",
      "새로운 배움이 즐거운 날이에요. 관심 있던 주제를 10분만 들여다보세요."
    ]
  };

  /* ---------- 시드 기반 난수 (같은 날 + 같은 별자리 = 같은 결과) ---------- */
  function hashStr(s){
    var h = 2166136261 >>> 0;
    for (var i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- 별자리 판별 ---------- */
  function getSign(m, d){
    for (var i=0;i<SIGNS.length;i++){
      var s = SIGNS[i];
      if (s.sm === s.em){ // 같은 달 안에서 끝나는 구간 (없음, 안전장치)
        if (m === s.sm && d >= s.sd && d <= s.ed) return s;
      } else if (s.sm < s.em){
        if ((m === s.sm && d >= s.sd) || (m === s.em && d <= s.ed)) return s;
      } else { // 연말~연초 (염소자리)
        if ((m === s.sm && d >= s.sd) || (m === s.em && d <= s.ed)) return s;
      }
    }
    return null;
  }

  /* ---------- 입력 검증 ---------- */
  function validate(y, m, d){
    if (!y || !m || !d) return "생년월일을 모두 입력해 주세요.";
    if (y < 1900 || y > 2100) return "1900년부터 2100년 사이의 날짜만 입력할 수 있어요.";
    var dt = new Date(y, m-1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d){
      return "존재하지 않는 날짜예요. 다시 확인해 주세요. (예: 2001년 2월 29일은 없어요)";
    }
    return null;
  }

  /* ---------- 운세 계산 ---------- */
  function buildFortune(sign, y, m, d, today){
    var dateKey = today.getFullYear() + "-" + (today.getMonth()+1) + "-" + today.getDate();
    var rnd = mulberry32(hashStr(dateKey + "|" + sign.name));

    var cats = ["총운","애정운","금전운","일/학업운"];
    var scores = cats.map(function(){ return 55 + Math.floor(rnd()*46); }); // 55~100

    var lines = cats.map(function(c){
      var arr = FORTUNE_LINES[c];
      return arr[Math.floor(rnd()*arr.length)];
    });

    // 행운의 숫자 3개 (1~45, 중복 없음)
    var nums = [];
    while (nums.length < 3){
      var n = 1 + Math.floor(rnd()*45);
      if (nums.indexOf(n) === -1) nums.push(n);
    }
    var color = COLORS[Math.floor(rnd()*COLORS.length)];

    return {cats:cats, scores:scores, lines:lines, nums:nums, color:color};
  }

  /* ---------- 렌더 ---------- */
  var $ = function(id){ return document.getElementById(id); };

  function render(sign, y, m, d){
    var today = new Date();
    var f = buildFortune(sign, y, m, d, today);

    $("icon").textContent = sign.icon;
    $("signName").textContent = sign.name;
    $("signMeta").textContent = sign.sm + "월 " + sign.sd + "일 ~ " + sign.em + "월 " + sign.ed + "일";
    $("dateLine").textContent = today.getFullYear() + "년 " + (today.getMonth()+1) + "월 " + today.getDate() + "일 · " + sign.name + "의 오늘 운세";
    $("trait").textContent = sign.trait;

    var bars = $("bars");
    bars.innerHTML = "";
    f.cats.forEach(function(c, i){
      var item = document.createElement("div");
      item.className = "bar-item";
      item.innerHTML =
        '<div class="bar-top"><b>' + c + '</b><span>' + f.scores[i] + '점</span></div>' +
        '<div class="bar-bg"><div class="bar-fill" data-w="' + f.scores[i] + '"></div></div>';
      bars.appendChild(item);
    });

    $("fortuneText").textContent = f.lines.join(" ");

    var numsEl = $("nums");
    numsEl.innerHTML = "";
    f.nums.forEach(function(n){
      var el = document.createElement("div");
      el.className = "num";
      el.textContent = n;
      numsEl.appendChild(el);
    });

    $("colorName").textContent = f.color.name;
    $("colorDot").style.background = f.color.hex;
    $("colorDot").style.color = f.color.hex;

    $("result").classList.add("show");

    // 막대 애니메이션
    requestAnimationFrame(function(){
      setTimeout(function(){
        var fills = bars.querySelectorAll(".bar-fill");
        for (var i=0;i<fills.length;i++) fills[i].style.width = fills[i].getAttribute("data-w") + "%";
      }, 60);
    });
  }

  function onGo(){
    var val = $("birth").value;
    var msg = $("msg");
    msg.className = "msg";
    if (!val){
      msg.textContent = "생년월일을 입력해 주세요.";
      $("result").classList.remove("show");
      return;
    }
    var parts = val.split("-");
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
    var err = validate(y, m, d);
    if (err){
      msg.textContent = err;
      $("result").classList.remove("show");
      return;
    }
    var sign = getSign(m, d);
    if (!sign){
      msg.textContent = "별자리를 찾을 수 없어요. 날짜를 다시 확인해 주세요.";
      $("result").classList.remove("show");
      return;
    }
    msg.className = "msg ok";
    msg.textContent = sign.name + "이시군요! 오늘의 운세를 확인해 보세요.";
    render(sign, y, m, d);
  }

  $("go").addEventListener("click", onGo);
  $("birth").addEventListener("keydown", function(e){ if (e.key === "Enter") onGo(); });

  /* ---------- 별 배경 생성 ---------- */
  (function stars(){
    var box = $("stars");
    var frag = document.createDocumentFragment();
    var n = window.innerWidth < 600 ? 90 : 160;
    for (var i=0;i<n;i++){
      var s = document.createElement("div");
      s.className = "star";
      var size = Math.random()*2 + 0.6;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random()*100) + "%";
      s.style.top = (Math.random()*100) + "%";
      s.style.setProperty("--d", (1.5 + Math.random()*3).toFixed(2) + "s");
      s.style.animationDelay = (Math.random()*3).toFixed(2) + "s";
      frag.appendChild(s);
    }
    for (var j=0;j<3;j++){
      var sh = document.createElement("div");
      sh.className = "shooting";
      sh.style.left = (60 + Math.random()*40) + "%";
      sh.style.top = (Math.random()*30) + "%";
      sh.style.animationDelay = (j*2.5 + Math.random()*2).toFixed(1) + "s";
      frag.appendChild(sh);
    }
    box.appendChild(frag);
  })();

  // 테스트용 노출 (브라우저 동작에는 영향 없음)
  window.__astro = {getSign:getSign, validate:validate, buildFortune:buildFortune, SIGNS:SIGNS};
})();
</script>
